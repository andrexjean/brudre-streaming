name: BruDre Android TV

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brudre-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK e rodar testes unitários
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -z "$TMDB_API_KEY" ]; then echo "::warning::Segredo TMDB_API_KEY ausente: catálogo de lançamentos desativado"; fi
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease testDebugUnitTest 2>&1 | tee build.log

      - name: Verificar APK (manifesto, SDK, ABI, assinatura)
        if: success()
        run: |
          set -o pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          cp "$APK" BruDre-Streaming.apk
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          {
            echo "== aapt badging"; $BT/aapt dump badging BruDre-Streaming.apk | grep -E "package:|sdkVersion|targetSdkVersion|native-code|leanback|launchable|uses-feature|application-label:" ;
            echo "== apksigner"; $BT/apksigner verify --print-certs BruDre-Streaming.apk ;
            echo "== bibliotecas nativas"; unzip -l BruDre-Streaming.apk | grep "\.so" ;
            echo "== tamanho"; ls -l BruDre-Streaming.apk ;
            echo "== sha256"; sha256sum BruDre-Streaming.apk ;
          } | tee apk-check.txt
          git archive --format=zip --prefix=BruDre-Streaming/ -o BruDre-Streaming-Source.zip HEAD

      - name: Publicar resultados do build (branch ci-build)
        if: always()
        run: |
          mkdir -p /tmp/res
          cp build.log apk-check.txt /tmp/res/ 2>/dev/null || true
          cp -r app/build/test-results /tmp/res/unit-test-results 2>/dev/null || true
          cp BruDre-Streaming.apk /tmp/res/ 2>/dev/null || true
          echo "${{ job.status }} ${{ github.sha }}" > /tmp/res/STATUS
          cd /tmp/res
          git init -q && git checkout -q -b ci-build
          git add -A && git -c user.name=brudre-ci -c user.email=ci@brudre.local commit -qm "build ${{ github.run_id }} ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-build

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: brudre-apk
          path: |
            BruDre-Streaming.apk
            BruDre-Streaming-Source.zip
            apk-check.txt

  instrumented:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Servidor Torznab de referência (rede local com TLS + endpoint HTTPS público por túnel)
        run: |
          TORZNAB_KEY=$(openssl rand -hex 16)
          echo "TORZNAB_KEY=$TORZNAB_KEY" >> "$GITHUB_ENV"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/tz.key -out /tmp/tz.crt -days 2 \
            -subj "/CN=brudre-torznab-ci" -addext "subjectAltName=IP:10.0.2.2" 2>/dev/null
          nohup python3 ci/torznab_server.py --port 8443 --cert /tmp/tz.crt --key /tmp/tz.key --apikey "$TORZNAB_KEY" > torznab-lan.log 2>&1 &
          nohup python3 ci/torznab_server.py --port 8080 --apikey "$TORZNAB_KEY" > torznab-public.log 2>&1 &
          sleep 2
          curl -skf "https://127.0.0.1:8443/api?t=caps&apikey=$TORZNAB_KEY" > /dev/null && echo "Torznab local: ok"
          # Túnel HTTPS temporário (certificado válido) para o cenário de endpoint público. Falhou? O teste fica BLOCKED.
          curl -sSL -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 && chmod +x /tmp/cloudflared || true
          if [ -x /tmp/cloudflared ]; then
            nohup /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8080 > cloudflared.log 2>&1 &
            for i in $(seq 1 30); do URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' cloudflared.log | head -1); [ -n "$URL" ] && break; sleep 2; done
            for i in $(seq 1 30); do [ -n "${URL:-}" ] && curl -sf "$URL/api?t=caps&apikey=$TORZNAB_KEY" > /dev/null && { echo "TORZNAB_PUBLIC=$URL" >> "$GITHUB_ENV"; echo "Torznab público: $URL"; break; }; sleep 3; done
          fi

      - name: Testes instrumentados no emulador (Android 11, x86_64)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          ram-size: 2048M
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./ci/run-instrumented.sh

      - name: Publicar resultados dos testes (branch ci-tests)
        if: always()
        run: |
          mkdir -p /tmp/res
          cp instrumented.log logcat.txt meminfo.txt instrumented.exit survey.txt torznab-lan.log torznab-public.log /tmp/res/ 2>/dev/null || true
          cp -r shots /tmp/res/ 2>/dev/null || true
          cp -r perf /tmp/res/ 2>/dev/null || true
          cp -r app/build/outputs/androidTest-results /tmp/res/ 2>/dev/null || true
          cp -r app/build/reports/androidTests /tmp/res/reports 2>/dev/null || true
          echo "${{ github.sha }}" > /tmp/res/SHA
          cd /tmp/res
          git init -q && git checkout -q -b ci-tests
          git add -A && git -c user.name=brudre-ci -c user.email=ci@brudre.local commit -qm "tests ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-tests

      - name: Falhar se os testes falharam
        run: test "$(cat instrumented.exit)" = "0"

  release:
    needs: [build, instrumented]
    # Só publica para a TV quando compilação E testes no emulador passaram.
    if: needs.build.result == 'success' && needs.instrumented.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: brudre-apk
      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v9.2.${{ github.run_number }}
          name: BruDre Streaming 9.2 (build ${{ github.run_number }})
          make_latest: "true"
          body: |
            APK para Android TV (Xiaomi Mi TV Stick e compatíveis).
            Compilado e aprovado nos testes unitários e instrumentados (emulador). Relatório: TEST_REPORT.md.
            Download direto na TV: https://github.com/${{ github.repository }}/releases/latest/download/BruDre-Streaming.apk
          files: |
            BruDre-Streaming.apk
            BruDre-Streaming-Source.zip
